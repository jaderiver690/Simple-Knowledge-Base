<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ARKKNOWLEDGE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b67f1'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='white' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f8;--panel:#fff;--panel2:#f8fafc;--text:#16202a;--muted:#718096;
  --line:#e4e9ef;--accent:#5b67f1;--accent2:#4652d8;--danger:#e05252;--ok:#2e9d6a;
  --shadow:0 18px 55px rgba(20,30,50,.08);--radius:16px;--sidebar:270px;
}
[data-theme="dark"]{
  --bg:#0d1117;--panel:#151b23;--panel2:#10151c;--text:#edf2f7;--muted:#8d99a8;
  --line:#27313d;--shadow:0 18px 55px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:fixed;inset:0 auto 0 0;z-index:20;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:8px 10px 22px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#9a75ff);display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;box-shadow:0 10px 25px #5965ef38;overflow:hidden}
.brand-text{min-width:0}
.brand-name{font-weight:800;font-size:15px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-section{margin:17px 8px 7px;color:var(--muted);font-size:11px;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--muted);padding:10px 11px;border-radius:11px;text-align:left;margin:2px 0}
.nav-item:hover{background:var(--panel2);color:var(--text)}.nav-item.active{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:700}
.nav-icon{width:21px;text-align:center}.nav-count{margin-left:auto;font-size:11px}
.main{margin-left:var(--sidebar);width:calc(100% - var(--sidebar));min-width:0}
.topbar{height:72px;background:color-mix(in srgb,var(--panel) 94%,transparent);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 28px;position:sticky;top:0;z-index:15;backdrop-filter:blur(16px)}
.search{flex:1;max-width:620px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 42px 11px 40px;outline:0}
.search > span{position:absolute;left:14px;top:9px;color:var(--muted)}
.kbd{position:absolute;right:10px;top:8px;color:var(--muted);font-size:11px;border:1px solid var(--line);padding:4px 6px;border-radius:6px;background:var(--panel)}
.search-drop{position:absolute;left:0;right:0;top:48px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:360px;overflow:auto;display:none;z-index:40}
.search-drop.show{display:block}
.search-drop button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:10px 12px}
.search-drop button:hover{background:var(--panel2)}
.search-drop .drop-meta{display:block;color:var(--muted);font-size:12px;margin-top:3px;font-weight:400}
.top-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px}
.icon-btn{width:40px;height:40px;padding:0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger,.mini.danger{color:var(--danger)}
.btn.ok,.mini.ok{color:var(--ok)}
.content{padding:28px;max-width:1500px;margin:auto}
.view{display:none}.view.active{display:block}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
.eyebrow{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:1.2px}
.page-title{font-size:29px;margin:5px 0}
.page-desc{color:var(--muted);font-size:14px;line-height:1.6}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow)}
.stat-label{color:var(--muted);font-size:12px}
.stat-num{font-size:28px;font-weight:800;margin-top:8px}
.stat-foot{font-size:11px;color:var(--muted);margin-top:5px}
.two{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr)}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow)}
.card-title{font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.article-list{display:grid;gap:8px}
.article-row{display:flex;align-items:center;gap:13px;padding:13px;border:1px solid transparent;border-radius:12px;cursor:pointer}
.article-row:hover{background:var(--panel2);border-color:var(--line)}
.article-icon{width:39px;height:39px;border-radius:11px;background:var(--panel2);display:grid;place-items:center;font-size:18px;flex:none}
.article-main{min-width:0;flex:1}
.article-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.article-meta{color:var(--muted);font-size:11px;margin-top:4px}
.row-actions{display:flex;gap:5px}
.mini{border:0;background:none;color:var(--muted);padding:6px}
.mini:hover{color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:11px;margin:2px}
.tag-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:600;margin-left:4px}
.badge.draft{color:#8a5a10;background:#f8e7c4;border-color:transparent}
[data-theme="dark"] .badge.draft{color:#f0d7a2;background:#3d3118}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{border-bottom:1px solid var(--line);padding:12px 9px;text-align:left;font-size:13px}
.table th{color:var(--muted);font-size:11px;font-weight:700}
.table td{vertical-align:middle}
.check{width:16px;height:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px;align-items:center}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 11px}
.category-tree{display:grid;gap:8px}
.cat-row{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;display:flex;align-items:center;gap:9px}
.cat-row.sub{background:var(--panel2)}
.cat-name{flex:1;min-width:0}
.drag{cursor:grab;color:var(--muted);user-select:none}
.modal-bg{position:fixed;inset:0;background:#0b101866;display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.show{display:flex}
.modal{width:min(900px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 100px #0004}
.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:22px}
.modal-foot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 11px;border-radius:10px;outline:0}
.field textarea{min-height:130px;resize:vertical}
.editor{min-height:280px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1.6}
.checkline{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
.cover-preview{width:100%;height:130px;border-radius:12px;object-fit:cover;background:var(--panel2);display:none}
.article-page{max-width:980px;margin:auto}
.article-cover{width:100%;max-height:330px;object-fit:cover;border-radius:18px;margin-bottom:22px}
.article-head h1{font-size:39px;line-height:1.2;margin:8px 0}
.article-summary{color:var(--muted);font-size:16px;line-height:1.7}
.article-content{font-size:15px;line-height:1.9}
.article-content h1,.article-content h2,.article-content h3,.article-content h4,.article-content h5,.article-content h6{line-height:1.35;margin-top:28px;scroll-margin-top:88px}
.article-content blockquote{border-left:3px solid var(--accent);padding-left:15px;color:var(--muted);margin:12px 0}
.article-content code{background:var(--panel2);padding:2px 5px;border-radius:5px}
.article-content pre{background:#111827;color:#e5e7eb;padding:15px;border-radius:12px;overflow:auto}
.article-content pre code{background:transparent;color:inherit;padding:0}
.article-content img{max-width:100%;border-radius:12px}
.article-content ul,.article-content ol{padding-left:1.3em}
.article-content hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.article-actions{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0}
.toc{border:1px solid var(--line);background:var(--panel2);padding:15px;border-radius:13px;margin:18px 0}
.toc a{display:block;color:var(--muted);font-size:13px;text-decoration:none;padding:3px 0}
.toc a:hover{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty-icon{font-size:28px;margin-bottom:8px}
.site-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.site-card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px;transition:.16s;cursor:pointer;box-shadow:var(--shadow)}
button.site-card{width:100%;font:inherit;text-align:left}
.site-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.site-card-icon{font-size:24px;margin-bottom:12px}
.site-card-title{font-weight:750;font-size:15px}
.site-card-desc{color:var(--muted);font-size:12px;line-height:1.7;margin-top:7px}
.site-card-meta{font-size:11px;color:var(--muted);margin-top:12px}
.site-section{margin-top:8px}
.site-section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}
.site-section-title{font-size:19px;font-weight:800}
.site-section-desc{font-size:12px;color:var(--muted);margin-top:4px}
.search-page{max-width:1080px;margin:0 auto}
.search-results{display:grid;gap:10px}
.search-result{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;cursor:pointer}
.search-result:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--panel2)}
.search-result-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search-result-title{font-size:15px;font-weight:800}
.search-result-path{font-size:11px;color:var(--muted)}
.search-result-snippet{font-size:13px;line-height:1.75;margin-top:8px}
.search-highlight{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:3px;padding:0 2px}
.search-empty{padding:48px 20px;text-align:center;color:var(--muted)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
.crumbs button{border:0;background:none;color:var(--accent);padding:0}
.doc-manager{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;min-height:620px}
.doc-tree{padding:8px;overflow:auto;max-height:calc(100vh - 250px)}
.tree-node{margin:2px 0}
.tree-node-line{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:10px;cursor:pointer;min-width:0}
.tree-node-line:hover{background:var(--panel2)}
.tree-node-line.active{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.tree-toggle{width:20px;height:20px;border:0;background:transparent;color:var(--muted);padding:0}
.tree-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-level{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 4px;flex:none}
.tree-actions{display:none;gap:3px}
.tree-node-line:hover .tree-actions{display:flex}
.doc-editor{display:flex;flex-direction:column;min-width:0}
.doc-editor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:8px}
.doc-editor-title{font-size:18px;font-weight:800}
.doc-editor-sub{font-size:12px;color:var(--muted);margin-top:5px}
.node-editor{padding:4px 0 0}
.node-title-input{font-size:18px;font-weight:700}
.node-body-editor{display:block;width:100%;min-height:320px;box-sizing:border-box;resize:vertical;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font-size:15px;line-height:1.75;font-family:inherit}
.node-title-input:focus,.node-body-editor:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 15%,transparent)}
.node-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.editor-tabs{display:flex;gap:12px;margin:8px 0}
.editor-tab{border:0;background:none;color:var(--muted);padding:6px 0;border-bottom:2px solid transparent}
.editor-tab.active{color:var(--accent);border-color:var(--accent)}
.doc-empty{padding:50px 25px;text-align:center;color:var(--muted)}
.doc-preview{padding:8px 4px;line-height:1.8}
.doc-preview h1{font-size:28px}.doc-preview h2{font-size:22px}.doc-preview h3{font-size:18px}
.manager-note{font-size:13px;color:var(--muted);line-height:1.7;padding:10px 12px;background:var(--panel2);border-radius:10px;margin-bottom:12px}
.settings-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.settings-tab{border:0;background:none;color:var(--muted);padding:11px 13px;border-bottom:2px solid transparent;white-space:nowrap}
.settings-tab.active{color:var(--accent);border-color:var(--accent)}
.setting-section{display:none}
.setting-section.active{display:block}
.setting-line{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--line);align-items:center}
.setting-line:last-child{border-bottom:0}
.setting-info strong{display:block;font-size:13px}
.setting-info span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.switch{width:46px;height:25px;border-radius:30px;background:var(--line);position:relative;border:0;flex:none}
.switch i{width:19px;height:19px;background:#fff;border-radius:50%;position:absolute;left:3px;top:3px;transition:.2s}
.switch.on{background:var(--accent)}
.switch.on i{left:24px}
.command{position:fixed;inset:0;background:#0b101866;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:120}
.command.show{display:flex}
.command-box{width:min(700px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 100px #0006}
.command-input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:17px 19px;font-size:16px;outline:0}
.commands{max-height:450px;overflow:auto}
.command-item{padding:13px 18px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);cursor:pointer}
.command-item.active,.command-item:hover{background:var(--panel2)}
.toast{position:fixed;right:22px;bottom:22px;background:#151b23;color:#fff;padding:12px 16px;border-radius:11px;box-shadow:0 15px 40px #0004;display:none;z-index:200;max-width:min(420px,calc(100vw - 32px))}
.toast.show{display:block}
html[data-density="compact"] .content{padding:16px}
html[data-density="compact"] .card,html[data-density="compact"] .stat{padding:12px}
html[data-density="compact"] .topbar{height:58px}
html[data-density="compact"] .article-row{padding:8px}
@media(hover:none){.tree-actions{display:flex}}
@media(max-width:1000px){
  .doc-manager{grid-template-columns:1fr}
  .doc-tree{max-height:320px}
  .tree-actions{display:flex}
  .site-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:900px){
  :root{--sidebar:76px}
  .sidebar{padding:15px 8px}
  .brand-text,.nav-label,.nav-section,.nav-count{display:none}
  .brand{justify-content:center}
  .nav-item{justify-content:center}
  .main{width:calc(100% - 76px)}
  .content{padding:18px}
  .stats,.three{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  .topbar{padding:0 14px}
  .page-title{font-size:24px}
}
@media(max-width:620px){
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .stats,.site-grid{grid-template-columns:1fr}
  .top-actions .optional{display:none}
  .article-head h1{font-size:28px}
  .site-card:hover{transform:none}
}
@media print{
  .sidebar,.topbar,.toast,.modal-bg,.command,.search-drop,.article-actions,.head-actions,.toolbar,.nav-item{display:none!important}
  .main{margin:0!important;width:auto!important}
  .content{padding:0;max-width:none}
  .view{display:none!important}
  .view.active{display:block!important}
  .card,.stat{box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo" id="brandLogo">A</div><div class="brand-text"><div class="brand-name" id="brandName">ARKKNOWLEDGE</div><div class="brand-sub" id="brandSub">本地知识库</div></div></div>
  <div class="nav-section">浏览</div>
  <button class="nav-item active" type="button" data-view="home"><span class="nav-icon">⌂</span><span class="nav-label">目录</span></button>
  <button class="nav-item" type="button" data-view="dashboard"><span class="nav-icon">▦</span><span class="nav-label">工作台</span></button>
  <button class="nav-item" type="button" data-view="knowledge"><span class="nav-icon">▤</span><span class="nav-label">全部知识</span><span class="nav-count" id="knowledgeCount"></span></button>
  <button class="nav-item" type="button" data-view="favorites"><span class="nav-icon">★</span><span class="nav-label">收藏</span><span class="nav-count" id="favCount"></span></button>
  <button class="nav-item" type="button" data-view="recent"><span class="nav-icon">◷</span><span class="nav-label">最近访问</span></button>
  <div class="nav-section">整理</div>
  <button class="nav-item" type="button" data-view="document-manager"><span class="nav-icon">✎</span><span class="nav-label">正文</span><span class="nav-count" id="documentCount"></span></button>
  <button class="nav-item" type="button" data-view="categories"><span class="nav-icon">▣</span><span class="nav-label">分类</span></button>
  <button class="nav-item" type="button" data-view="tags"><span class="nav-icon">#</span><span class="nav-label">标签</span></button>
  <button class="nav-item" type="button" data-view="trash"><span class="nav-icon">♲</span><span class="nav-label">回收站</span><span class="nav-count" id="trashCount"></span></button>
  <div class="nav-section">系统</div>
  <button class="nav-item" type="button" data-view="analytics"><span class="nav-icon">◉</span><span class="nav-label">统计</span></button>
  <button class="nav-item" type="button" data-view="settings"><span class="nav-icon">⚙</span><span class="nav-label">设置</span></button>
</aside>

<main class="main">
<header class="topbar">
  <div class="search">
    <span>⌕</span>
    <input id="globalSearch" placeholder="搜索" autocomplete="off">
    <kbd class="kbd">/</kbd>
    <div id="searchDrop" class="search-drop"></div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="themeBtn" type="button" title="切换深浅色">☾</button>
    <button class="btn primary optional" type="button" onclick="openArticleEditor()">＋ 新建知识</button>
  </div>
</header>

<section class="content">
<div class="view active" id="view-home">
  <div class="page-head"><div><div class="page-title">目录</div></div>
    <button class="btn primary" type="button" onclick="openArticleEditor()">＋ 新建知识</button>
  </div>

function uid(p){return (p||"id")+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}

function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function safeColor(c){return /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(String(c||""))?String(c):"#5b67f1"}
function safeUrl(u){
  const raw=String(u||"").trim();
  if(/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(raw)) return raw.length<500000?raw:"";
  if(!/^https?:\/\//i.test(raw)) return "";
  try{
    const url=new URL(raw);
    if(url.protocol!=="http:"&&url.protocol!=="https:") return "";
    return url.href;

}
function repairPlainEscapes(s){
  s=String(s??"");
  // 老示例把换行存成了 \n 两个字符。正文里已经有真换行就不要动。
  if(s.indexOf("\n")!==-1) return s;
  if(s.indexOf("\\n")===-1 && s.indexOf("\\t")===-1) return s;
  repaired=true;
  return s.replace(/\\r\\n/g,"\n").replace(/\\n/g,"\n").replace(/\\t/g,"\t");
}
function toast(s){

function fmt(d){
  const t=new Date(d);

  return t.toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
}
function fmtFull(d){
  const t=new Date(d);

  const t=String(s||"").replace(/[#>*`_\-\[\]]/g," ").replace(/\s+/g," ").trim();

  n=n||80;
  return t.length>n?t.slice(0,n)+"…":t;

function cleanNodes(nodes,level){
  if(!Array.isArray(nodes)) return [];
  return nodes.filter(n=>n&&typeof n==="object").map(n=>{
    if(!n.id){n.id=uid("node");repaired=true}
    const lv=Math.max(1,Math.min(6,Number(n.level)||level||1));
    return {id:n.id,level:lv,title:String(n.title??""),content:repairPlainEscapes(n.content),children:cleanNodes(n.children,lv+1)};
  });
}
function flatHeadingBlob(article){
  const tree=article.documentTree;
  if(!tree||tree.length!==1) return false;
  const node=tree[0];
  if(node.children&&node.children.length) return false;
  return /(^|\n)#{1,6}\s+\S/.test(node.content||"");
}

  s=String(s??"");
  return s.indexOf("\n")===-1&&(s.indexOf("\\n")!==-1||s.indexOf("\\t")!==-1);
}
function normalizeArticle(article){
  if(!article.id){article.id=uid("article");repaired=true}
  article.title=String(article.title||"未命名");
  article.summary=String(article.summary||"");
  const legacyFlat=hadEscapedBreaks(article.content)||(Array.isArray(article.documentTree)&&article.documentTree.length===1&&hadEscapedBreaks(article.documentTree[0]&&article.documentTree[0].content));
  article.content=repairPlainEscapes(article.content);
  article.icon=article.icon||"◈";
  article.cover=article.cover||"";
  article.author=article.author||"";
  article.categoryId=article.categoryId||"";
  if(article.categoryId&&!state.categories.some(c=>c.id===article.categoryId)){article.categoryId="";repaired=true}
  if(!Array.isArray(article.tagIds)){article.tagIds=[];repaired=true}
  const tagCount=article.tagIds.length;
  article.tagIds=article.tagIds.filter(id=>state.tags.some(t=>t.id===id));
  if(article.tagIds.length!==tagCount) repaired=true;
  if(!Array.isArray(article.relatedIds)){article.relatedIds=[];repaired=true}
  article.relatedIds=article.relatedIds.filter(id=>id!==article.id&&state.articles.some(x=>x.id===id));
  if(article.status!=="draft"&&article.status!=="published") article.status="published";
  article.favorite=!!article.favorite;
  article.pinned=!!article.pinned;
  article.archived=!!article.archived;
  article.createdAt=article.createdAt||now();
  article.updatedAt=article.updatedAt||article.createdAt;
  if(Array.isArray(article.documentTree)&&article.documentTree.length){
    article.documentTree=cleanNodes(article.documentTree,1);
    readyTrees.add(article.documentTree);
    if(legacyFlat&&flatHeadingBlob(article)){
      if(!String(article.content||"").trim()) article.content=article.documentTree[0].content||"";
      article.documentTree=null;
      repaired=true;
    }
  }
  if(!Array.isArray(article.documentTree)||!article.documentTree.length){
    normalizeDocumentTree(article);
    article.content=documentToMarkdown(article);
    repaired=true;
  }
  article.readingTime=readingMinutes(article);
}
function normalize(){
  const seed=defaults();
  state.config={...seed.config,...(state.config||{})};
  ["navigation","categories","tags","articles","recent","versions","trash","logs"].forEach(key=>{
    if(!Array.isArray(state[key])){state[key]=[];repaired=true}
  });
  seed.navigation.forEach(item=>{
    if(!state.navigation.some(n=>n.id===item.id)){state.navigation.push({...item});repaired=true}
  });
  state.categories=state.categories.filter(c=>c&&typeof c==="object");
  state.categories.forEach(c=>{
    if(!c.id){c.id=uid("cat");repaired=true}
    if(!c.parentId) c.parentId=null;
    if(typeof c.order!=="number") c.order=1;
    c.color=safeColor(c.color);
    c.name=String(c.name||"未命名");
  });
  state.categories.forEach(c=>{
    if(c.parentId&&!state.categories.some(p=>p.id===c.parentId)){c.parentId=null;repaired=true}
  });
  state.categories.forEach(c=>{
    const seen=new Set();
    let cursor=c;
    while(cursor&&cursor.parentId){
      if(seen.has(cursor.id)){c.parentId=null;repaired=true;break}
      seen.add(cursor.id);
      cursor=state.categories.find(p=>p.id===cursor.parentId);
    }
  });
  state.tags=state.tags.filter(t=>t&&typeof t==="object");
  state.tags.forEach(t=>{
    if(!t.id){t.id=uid("tag");repaired=true}
    t.name=String(t.name||"未命名");
    t.color=safeColor(t.color);
  });
  state.articles=state.articles.filter(a=>a&&typeof a==="object");
  state.articles.forEach(normalizeArticle);
  state.trash=state.trash.filter(item=>item&&item.id&&item.type);
  state.logs=state.logs.filter(item=>item&&item.detail).slice(0,80);
  state.versions=state.versions.filter(item=>item&&item.id&&item.snapshot).slice(0,40);
  state.recent=state.recent.filter(id=>state.articles.some(a=>a.id===id)).slice(0,30);
}

function walkDocumentNodes(nodes,fn,parent){
  (nodes||[]).forEach(node=>{
    fn(node,parent||null);
    walkDocumentNodes(node.children||[],fn,node);
  });
}
function findDocumentNode(article,nodeId){
  let found=null;
  walkDocumentNodes(article.documentTree||[],(node,parent)=>{if(node.id===nodeId) found={node:node,parent:parent}});
  return found;
}
function nodePath(article,nodeId){
  let path=null;
  (function walk(nodes,acc){
    for(const node of nodes||[]){
      const next=acc.concat(node);
      if(node.id===nodeId){path=next;return true}
      if(walk(node.children||[],next)) return true;
    }
    return false;
  })(article.documentTree||[],[]);
  return path||[];
}
const readyTrees=new WeakSet();
function normalizeDocumentTree(article){
  if(Array.isArray(article.documentTree)&&article.documentTree.length){
    if(!readyTrees.has(article.documentTree)){
      article.documentTree=cleanNodes(article.documentTree,1);
      readyTrees.add(article.documentTree);
    }
    return article.documentTree;
  }
  const root={id:uid("node"),level:1,title:String(article.title||"未命名"),content:"",children:[]};
  const lines=String(article.content||"").replace(/\r\n/g,"\n").split("\n");
  let current=root;
  const stack=[root];
  let buffer=[];
  let inCode=false;
  const flush=()=>{
    if(!buffer.length) return;
    const chunk=buffer.join("\n").replace(/^\n+|\n+$/g,"");
    buffer=[];
    if(!chunk) return;
    current.content=current.content?current.content+"\n"+chunk:chunk;
  };
  for(const line of lines){
    if(/^```/.test(line)){inCode=!inCode;buffer.push(line);continue}
    if(inCode){buffer.push(line);continue}
    const matched=line.match(/^(#{1,6})\s+(.*)$/);
    if(!matched){buffer.push(line);continue}
    flush();
    let level=matched[1].length;
    // 文章标题自己占着一级，正文里的 # 当成二级
    if(level===1) level=2;
    while(stack.length&&stack[stack.length-1].level>=level) stack.pop();
    const parent=stack[stack.length-1]||root;
    const node={id:uid("node"),level:level,title:matched[2].trim()||"未命名",content:"",children:[]};
    parent.children.push(node);
    stack.push(node);
    current=node;
  }
  flush();
  article.documentTree=[root];
  readyTrees.add(article.documentTree);
  return article.documentTree;
}
function documentToMarkdown(article){
  const roots=normalizeDocumentTree(article)||[];
  const chunks=[];
  function walk(nodes,skipRoot){
    (nodes||[]).forEach((node,index)=>{
      if(skipRoot&&index===0){
        if(String(node.content||"").trim()) chunks.push(String(node.content).trim());
        walk(node.children||[],false);
        return;
      }
      const level=Math.max(2,Math.min(6,Number(node.level)||2));
      let block="#".repeat(level)+" "+(node.title||"未命名");
      if(String(node.content||"").trim()) block+="\n\n"+String(node.content).trim();
      chunks.push(block);
      walk(node.children||[],false);
    });
  }
  walk(roots,true);
  return chunks.join("\n\n").trim();
}
function readingMinutes(article){
  let count=0;
  const tree=article.documentTree&&article.documentTree.length?article.documentTree:null;
  if(!tree) count=String(article.content||"").length+String(article.title||"").length;
  else walkDocumentNodes(tree,node=>{count+=String(node.title||"").length+String(node.content||"").length});
  return Math.max(1,Math.ceil(count/400));
}
function touchTree(article){

}

function articleHits(article,q){

  const meta=(article.title+" "+(article.summary||"")+" "+catName(article.categoryId)+" "+tagNames(article.tagIds)).toLowerCase();
  if(meta.includes(q)) return true;
  let yes=false;
  walkDocumentNodes(article.documentTree,node=>{
    if((node.title+"\n"+node.content).toLowerCase().includes(q)) yes=true;
  });
  return yes;
}
function nodeOrChildHits(node,q){

  if((node.title+"\n"+node.content).toLowerCase().includes(q)) return true;
  return (node.children||[]).some(child=>nodeOrChildHits(child,q));

function snippetAround(text,q){
  const raw=String(text||"").replace(/\s+/g," ").trim();
  const at=raw.toLowerCase().indexOf(String(q||"").toLowerCase());
  if(at<0) return raw.slice(0,160);
  const start=Math.max(0,at-36);
  const end=Math.min(raw.length,at+q.length+72);
  return (start?"…":"")+raw.slice(start,end)+(end<raw.length?"…":"");
}
function highlightSearch(text,q){
  const raw=String(text||"");
  const needle=String(q||"");
  if(!needle) return esc(raw);
  const lower=raw.toLowerCase();
  const want=needle.toLowerCase();
  let i=0,out="";
  while(i<raw.length){
    const at=lower.indexOf(want,i);
    if(at<0){out+=esc(raw.slice(i));break}
    out+=esc(raw.slice(i,at))+'<span class="search-highlight">'+esc(raw.slice(at,at+want.length))+"</span>";
    i=at+want.length;
  }
  return out;
}
function getGlobalSearchMatches(q){
  q=String(q||"").trim().toLowerCase();
  if(!q) return [];
  const result=[];
  state.articles.filter(a=>!a.archived).forEach(article=>{
    normalizeDocumentTree(article);
    const seen=new Set();
    walkDocumentNodes(article.documentTree,node=>{
      const title=String(node.title||"");
      const body=String(node.content||"");
      const inTitle=title.toLowerCase().includes(q);
      const inBody=body.toLowerCase().includes(q);
      if(!inTitle&&!inBody) return;
      seen.add(node.id);
      result.push({
        article:article,
        node:node,
        source:inTitle&&inBody?"标题和正文":inTitle?"标题":"正文",
        snippet:snippetAround(inBody?body:title,q)
      });
    });
    const summary=String(article.summary||"");
    if(summary.toLowerCase().includes(q)&&article.documentTree[0]&&!seen.has(article.documentTree[0].id)){
      result.push({article:article,node:article.documentTree[0],source:"摘要",snippet:snippetAround(summary,q)});
    }
  });
  return result;
}

function renderGlobalSearch(q){
  const input=document.getElementById("globalSearchPageInput");
  const results=document.getElementById("globalSearchResults");
  const summary=document.getElementById("globalSearchSummary");
  if(!input||!results||!summary) return;
  if(q!==undefined) input.value=q;
  q=input.value.trim();
  if(!q){
    summary.textContent="";
    results.innerHTML="";
    return;
  }
  const matches=getGlobalSearchMatches(q);

function inlineFormat(raw){
  let text=esc(raw);
  text=text.replace(/`([^`]+)`/g,"<code>$1</code>");
  text=text.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g,'<img alt="$1" src="$2" referrerpolicy="no-referrer">');
  text=text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">$1</a>');
  text=text.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  text=text.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  return text;
}
function md(src){
  const lines=String(src||"").replace(/\r\n/g,"\n").split("\n");
  let html="",para=[],list=null,quote=[],code=null;
  const flushPara=()=>{if(!para.length) return; html+="<p>"+inlineFormat(para.join("\n")).replace(/\n/g,"<br>")+"</p>"; para=[]};
  const flushList=()=>{
    if(!list) return;
    const tag=list.type==="ol"?"ol":"ul";
    html+="<"+tag+">"+list.items.map(item=>"<li>"+inlineFormat(item)+"</li>").join("")+"</"+tag+">";
    list=null;
  };
  const flushQuote=()=>{if(!quote.length) return; html+="<blockquote>"+quote.map(line=>inlineFormat(line)).join("<br>")+"</blockquote>"; quote=[]};
  const flushAll=()=>{flushPara();flushList();flushQuote()};
  for(const line of lines){
    if(code){
      if(/^```/.test(line)){html+="<pre><code>"+esc(code.join("\n"))+"</code></pre>";code=null}
      else code.push(line);
      continue;
    }
    if(/^```/.test(line)){flushAll();code=[];continue}
    if(!line.trim()){flushAll();continue}
    let matched=line.match(/^(#{1,6})\s+(.*)$/);
    if(matched){flushAll();html+="<h"+matched[1].length+">"+inlineFormat(matched[2])+"</h"+matched[1].length+">";continue}
    if(/^\s*[-*]\s+/.test(line)){
      flushPara();flushQuote();
      if(!list||list.type!=="ul"){flushList();list={type:"ul",items:[]}}
      list.items.push(line.replace(/^\s*[-*]\s+/,""));
      continue;
    }
    if(/^\s*\d+[.)]\s+/.test(line)){
      flushPara();flushQuote();
      if(!list||list.type!=="ol"){flushList();list={type:"ol",items:[]}}
      list.items.push(line.replace(/^\s*\d+[.)]\s+/,""));
      continue;
    }
    matched=line.match(/^>\s?(.*)$/);
    if(matched){flushPara();flushList();quote.push(matched[1]);continue}
    if(/^(---|\*\*\*)$/.test(line.trim())){flushAll();html+="<hr>";continue}
    flushList();flushQuote();
    para.push(line);
  }
  if(code) html+="<pre><code>"+esc(code.join("\n"))+"</code></pre>";
  flushAll();
  return html;
}
function renderTreeHtml(article,skipRoot){
  normalizeDocumentTree(article);
  let html="";
  function walk(nodes,skip){
    (nodes||[]).forEach((node,index)=>{
      const level=Math.max(1,Math.min(6,Number(node.level)||1));
      if(skip&&index===0){
        if(node.content) html+=md(node.content);
        walk(node.children,false);
        return;
      }
      html+="<h"+level+' data-node-id="'+esc(node.id)+'" id="h_'+esc(node.id)+'">'+esc(node.title||"未命名")+"</h"+level+">";
      if(node.content) html+=md(node.content);
      walk(node.children,false);
    });
  }
  walk(article.documentTree,!!skipRoot);
  return html;
}

function copyText(text){
  const done=()=>toast("链接复制好了");
  const fallback=()=>{
    const area=document.createElement("textarea");
    area.value=text;
    document.body.appendChild(area);
    area.select();
    let ok=false;
    try{ok=document.execCommand("copy")}catch(e){ok=false}
    area.remove();
    if(ok) done();
    else prompt("浏览器拦了剪贴板，手动复制这一段：",text);
  };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

function categoryOptions(selectedId,withEmpty){
  const roots=state.categories.filter(c=>!c.parentId).sort((a,b)=>a.order-b.order);
  const out=[];
  if(withEmpty) out.push('<option value=""'+(selectedId?"":" selected")+">未分类</option>");
  function walk(category,level,seen){
    if(!category||seen.has(category.id)) return;
    seen.add(category.id);
    out.push('<option value="'+esc(category.id)+'"'+(category.id===selectedId?" selected":"")+">"+"　".repeat(level)+esc(category.icon||"")+" "+esc(category.name)+"</option>");
    state.categories.filter(item=>item.parentId===category.id).sort((a,b)=>a.order-b.order).forEach(item=>walk(item,level+1,seen));
  }
  roots.forEach(item=>walk(item,0,new Set()));
  return out.join("");
}

function saveArticle(id){
  const title=document.getElementById("afTitle").value.trim();
  if(!title){toast("标题不能空着");return}
  const typed=document.getElementById("afContent").value;
  const cover=document.getElementById("afCover").value.trim();
  if(cover&&!safeUrl(cover)){toast("封面需要 http(s) 图片地址，或者一张不太大的本地图片");return}
  const old=id?articleById(id):null;
  let tree;
  if(!old){
    tree=buildTree(title,typed).documentTree;
  }else{
    const current=documentToMarkdown(old).trim();
    if(typed.trim()===current){
      tree=JSON.parse(JSON.stringify(old.documentTree||[]));
      if(tree[0]) tree[0].title=title;
    }else if(confirm("正文和现在的目录不一致。确定就按 Markdown 重建目录，取消则只保存标题和属性。")){
      tree=buildTree(title,typed).documentTree;
    }else{
      tree=JSON.parse(JSON.stringify(old.documentTree||[]));
      if(tree[0]) tree[0].title=title;
    }
  }
  const related=[...document.getElementById("afRelated").selectedOptions].map(o=>o.value).filter(value=>value&&value!==id);
  const tags=[...document.querySelectorAll(".afTag:checked")].map(el=>el.value);
  if(old) pushVersion(old);
  const obj={
    id:id||uid("article"),
    title:title,
    summary:document.getElementById("afSummary").value.trim(),
    icon:Array.from(document.getElementById("afIcon").value.trim()||"◈").slice(0,4).join(""),
    cover:cover,
    categoryId:document.getElementById("afCat").value,
    tagIds:tags,
    status:document.getElementById("afStatus").value,
    favorite:document.getElementById("afFav").checked,
    pinned:document.getElementById("afPin").checked,
    archived:document.getElementById("afArch").checked,
    author:document.getElementById("afAuthor").value.trim(),
    relatedIds:related,
    createdAt:old?.createdAt||now(),
    updatedAt:now(),
    documentTree:tree,
    slug:old?.slug||("k-"+ (id||"new"))
  };
  obj.content=documentToMarkdown(obj);
  obj.readingTime=readingMinutes(obj);
  if(!old) obj.slug="k-"+obj.id;
  if(old) Object.assign(old,obj);
  else state.articles.unshift(obj);
  log(id?"edit":"create",(id?"修改：":"新建：")+title);
  save();
  closeModal();
  toast(id?"已保存":"已新建");
  renderAll();
  openArticle(obj.id);
}
function buildTree(title,content){
  const article={title:title,content:content||"",documentTree:null};
  normalizeDocumentTree(article);
  if(article.documentTree[0]) article.documentTree[0].title=title;
  article.content=documentToMarkdown(article);
  return article;
}

function renderDocumentManager(){
  const box=document.getElementById("documentTree");
  if(!box) return;
  const q=(document.getElementById("docTreeSearch")?.value||"").trim().toLowerCase();
  const articles=state.articles.filter(article=>articleHits(article,q));
  const hint=document.getElementById("documentTreeHint");
  if(hint) hint.textContent=articles.length+" 篇";
  if(!articles.length){box.innerHTML=empty(q?"没有匹配的标题或正文":"还没有知识");return}
  const top=box.scrollTop;
  let html="";
  const draw=(article,node,depth,metaHit)=>{
    if(q&&!metaHit&&!nodeOrChildHits(node,q)) return;
    const key=article.id+":"+node.id;
    const open=q?true:documentOpenState[key]!==false;
    const has=(node.children||[]).length>0;
    const active=documentSelected.articleId===article.id&&documentSelected.nodeId===node.id;
    html+='<div class="tree-node"><div class="tree-node-line'+(active?" active":"")+'" data-act="select-node" data-article="'+esc(article.id)+'" data-node="'+esc(node.id)+'">'
      +'<span style="width:'+(depth*12)+'px;flex:none"></span>'
      +'<button type="button" class="tree-toggle" data-act="toggle-branch" data-key="'+esc(key)+'">'+(has?(open?"▾":"▸"):"·")+"</button>"
      +'<span class="tree-level">H'+node.level+"</span>"
      +'<span class="tree-title">'+esc(node.title||"未命名")+(depth===0?statusBadge(article):"")+"</span>"
      +'<span class="tree-actions"><button type="button" class="mini" data-act="add-child" data-article="'+esc(article.id)+'" data-node="'+esc(node.id)+'">＋</button></span></div>';
    if(has&&open) node.children.forEach(child=>draw(article,child,depth+1,metaHit));
    html+="</div>";
  };
  articles.forEach(article=>{
    normalizeDocumentTree(article);
    const meta=(article.title+" "+(article.summary||"")+" "+catName(article.categoryId)+" "+tagNames(article.tagIds)).toLowerCase();
    const metaHit=!!q&&meta.includes(q);
    (article.documentTree||[]).forEach(node=>draw(article,node,0,metaHit));
  });
  box.innerHTML=html;
  box.scrollTop=top;
}

function markDraftDirty(){
  if(!documentDraft) return;
  documentDraft.title=document.getElementById("nodeTitle").value;
  documentDraft.content=document.getElementById("nodeBody").value;
  documentDraft.level=Number(document.getElementById("nodeLevel").value);
  documentDraft.dirty=true;
  const stateEl=document.getElementById("documentSaveState");
  if(stateEl) stateEl.textContent="待保存";
  const count=document.getElementById("nodeCount");
  if(count) count.textContent=documentDraft.content.length+" 字";
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>saveDocumentNode(true),700);
}
function saveDocumentNode(silent){
  const got=getSelectedDocumentNode();
  if(!got){if(!silent) toast("还没选中标题");return}
  const title=(document.getElementById("nodeTitle")?document.getElementById("nodeTitle").value:documentDraft?.title||"").trim();
  if(!title){if(!silent) toast("标题不能空着");return}
  const content=document.getElementById("nodeBody")?document.getElementById("nodeBody").value:(documentDraft?.content||"");
  const level=Math.max(1,Math.min(6,Number(document.getElementById("nodeLevel")?.value||got.hit.node.level)||1));
  const article=got.article;
  const node=got.hit.node;
  if(node.title===title&&node.content===content&&Number(node.level)===level){
    if(documentDraft) documentDraft.dirty=false;
    const stateEl=document.getElementById("documentSaveState");
    if(stateEl) stateEl.textContent="已保存";
    return;
  }
  if(!documentDraft?.snapshotted){
    pushVersion(article);
    if(documentDraft) documentDraft.snapshotted=true;
  }
  node.title=title;
  node.content=content;
  node.level=level;
  touchTree(article);
  clearTimeout(draftTimer);
  documentDraft={articleId:article.id,nodeId:node.id,title:title,content:content,level:level,dirty:false,snapshotted:true};
  if(!silent) log("edit","保存正文："+title);
  save();
  const tree=document.getElementById("documentTree");
  const top=tree?tree.scrollTop:0;
  renderDocumentManager();
  if(tree) document.getElementById("documentTree").scrollTop=top;
  const sub=document.querySelector(".doc-editor-sub");
  if(sub) sub.textContent=article.title+" / "+title;
  const stateEl=document.getElementById("documentSaveState");
  if(stateEl) stateEl.textContent=silent?"已自动保存":"已保存";
  if(!silent) toast("已保存");
}
function discardDocumentDraft(){
  if(documentDraft?.dirty&&!confirm("丢掉还没保存的修改？")) return;
  clearTimeout(draftTimer);
  documentDraft=null;
  renderDocumentNodeEditor();
}
function flushCurrentIfNeeded(){
  if(!documentDraft?.dirty) return true;
  const title=(document.getElementById("nodeTitle")?.value||"").trim();
  if(!title){toast("先把当前标题补上");return false}
  saveDocumentNode(true);
  return true;
}
function addDocumentNode(articleId,nodeId,mode){
  const article=articleById(articleId);
  if(!article||!flushCurrentIfNeeded()) return;
  normalizeDocumentTree(article);
  const info=siblingInfo(article,nodeId);
  if(!info) return;
  if(mode==="child"&&info.hit.node.level>=6){toast("H6 下面不能再加了");return}
  const node={id:uid("node"),level:mode==="child"?Math.min(6,info.hit.node.level+1):info.hit.node.level,title:"未命名",content:"",children:[]};
  if(mode==="child"){
    info.hit.node.children.push(node);
    documentOpenState[articleId+":"+nodeId]=true;
  }else info.arr.splice(info.index+1,0,node);
  touchTree(article);
  log("edit",(mode==="child"?"加了下级：":"加了同级：")+article.title);
  save();
  selectFresh(articleId,node.id);
}
function moveDocumentNode(articleId,nodeId,dir){
  const article=articleById(articleId);
  if(!article||!flushCurrentIfNeeded()) return;
  const info=siblingInfo(article,nodeId);
  if(!info) return;
  const next=info.index+dir;
  if(next<0||next>=info.arr.length){toast(dir<0?"已经到顶了":"已经到底了");return}
  const [item]=info.arr.splice(info.index,1);
  info.arr.splice(next,0,item);
  touchTree(article);
  save();
  selectFresh(articleId,nodeId);
}
function shiftDescendants(node,delta){
  (node.children||[]).forEach(child=>{
    child.level=Math.max(1,Math.min(6,(Number(child.level)||1)+delta));
    shiftDescendants(child,delta);
  });
}
function promoteDocumentNode(articleId,nodeId){
  const article=articleById(articleId);
  if(!article||!flushCurrentIfNeeded()) return;
  const info=siblingInfo(article,nodeId);
  if(!info) return;
  if(!info.hit.parent){toast("已经是最上面一层");return}
  const parentInfo=siblingInfo(article,info.hit.parent.id);
  if(!parentInfo) return;
  const [item]=info.arr.splice(info.index,1);
  const oldLevel=Number(item.level)||1;
  item.level=Number(info.hit.parent.level)||1;
  shiftDescendants(item,item.level-oldLevel);
  parentInfo.arr.splice(parentInfo.index+1,0,item);
  touchTree(article);
  log("edit","调整了目录："+article.title);
  save();
  selectFresh(articleId,nodeId);
}
function demoteDocumentNode(articleId,nodeId){
  const article=articleById(articleId);
  if(!article||!flushCurrentIfNeeded()) return;
  const info=siblingInfo(article,nodeId);
  if(!info) return;
  if(info.index<=0){toast("上面没有标题，不能降级");return}
  const prev=info.arr[info.index-1];
  if((prev.level||1)>=6){toast("上一个标题已经是 H6");return}
  const [item]=info.arr.splice(info.index,1);
  const oldLevel=Number(item.level)||1;
  item.level=Math.min(6,(prev.level||1)+1);
  shiftDescendants(item,item.level-oldLevel);
  prev.children=prev.children||[];
  prev.children.push(item);
  documentOpenState[articleId+":"+prev.id]=true;
  touchTree(article);
  log("edit","调整了目录："+article.title);
  save();
  selectFresh(articleId,nodeId);
}
function deleteDocumentNode(articleId,nodeId){
  const article=articleById(articleId);
  if(!article||!flushCurrentIfNeeded()) return;
  const info=siblingInfo(article,nodeId);
  if(!info) return;
  if(!info.hit.parent&&article.documentTree.length===1){toast("根标题不能删。要删整篇，去知识列表。");return}
  if((info.hit.node.children||[]).length&&!confirm("下级标题会一起删掉。")) return;
  pushVersion(article);
  info.arr.splice(info.index,1);
  const next=info.arr[Math.min(info.index,info.arr.length-1)]||article.documentTree[0];
  touchTree(article);
  log("edit","删了一节："+article.title);
  save();
  if(next) selectFresh(article.id,next.id);
  else {documentSelected={articleId:null,nodeId:null};renderDocumentManager();renderDocumentNodeEditor()}
  toast("已删除，旧版本还留着");
}

function catFamily(id){
  const ids=[id];
  let index=0;
  while(index<ids.length){
    const current=ids[index++];
    state.categories.forEach(c=>{if(c.parentId===current&&!ids.includes(c.id)) ids.push(c.id)});
  }
  return ids;
}
function isDescendant(id,ancestor){
  if(!id||!ancestor||id===ancestor) return false;
  const seen=new Set();
  let cursor=state.categories.find(c=>c.id===id);
  while(cursor&&cursor.parentId&&!seen.has(cursor.id)){
    if(cursor.parentId===ancestor) return true;
    seen.add(cursor.id);
    cursor=state.categories.find(c=>c.id===cursor.parentId);
  }
  return false;
}
function normalizeCatOrder(){
  const parents=new Set([null]);
  state.categories.forEach(c=>parents.add(c.parentId||null));
  parents.forEach(parent=>{
    state.categories.filter(c=>(c.parentId||null)===(parent||null)).sort((a,b)=>a.order-b.order).forEach((c,index)=>c.order=index+1);
  });
}
function renderCategories(){
  const box=document.getElementById("categoryTree");
  if(!box) return;
  const roots=state.categories.filter(c=>!c.parentId).sort((a,b)=>a.order-b.order);
  let html="";
  function draw(category,level,seen){
    if(!category||seen.has(category.id)) return;
    seen.add(category.id);
    const count=state.articles.filter(a=>a.categoryId===category.id&&!a.archived).length;
    html+='<div class="cat-row'+(level?" sub":"")+'" data-cat="'+esc(category.id)+'" style="margin-left:'+(level*22)+'px">'
      +'<span class="drag" draggable="true" data-id="'+esc(category.id)+'">⋮⋮</span><span>'+esc(category.icon||"")+"</span>"
      +'<span class="cat-name">'+esc(category.name)+' <small style="color:var(--muted)">'+count+" 篇</small></span>"
      +'<button type="button" class="mini" data-act="edit-cat" data-id="'+esc(category.id)+'">✎</button>'
      +'<button type="button" class="mini" data-act="add-subcat" data-id="'+esc(category.id)+'">＋</button>'
      +'<button type="button" class="mini" data-act="move-cat" data-id="'+esc(category.id)+'" data-dir="-1">↑</button>'
      +'<button type="button" class="mini" data-act="move-cat" data-id="'+esc(category.id)+'" data-dir="1">↓</button>'
      +'<button type="button" class="mini danger" data-act="delete-cat" data-id="'+esc(category.id)+'">删除</button></div>';
    state.categories.filter(item=>item.parentId===category.id).sort((a,b)=>a.order-b.order).forEach(item=>draw(item,level+1,seen));
  }
  roots.forEach(item=>draw(item,0,new Set()));
  box.innerHTML=html||empty("还没有分类");
  box.querySelectorAll(".drag").forEach(handle=>{
    handle.addEventListener("dragstart",event=>{draggedCat=handle.dataset.id;event.dataTransfer.effectAllowed="move"});
  });
  box.querySelectorAll(".cat-row").forEach(row=>{
    row.addEventListener("dragover",event=>event.preventDefault());
    row.addEventListener("drop",event=>{
      event.preventDefault();
      const target=row.dataset.cat;
      if(!draggedCat||draggedCat===target) return;
      if(isDescendant(target,draggedCat)){toast("不能拖进自己的下级");return}
      const from=state.categories.find(c=>c.id===draggedCat);
      const to=state.categories.find(c=>c.id===target);
      if(!from||!to) return;
      from.parentId=to.parentId;
      from.order=to.order-0.5;
      normalizeCatOrder();
      log("sort","调整了分类："+from.name);
      save();
      renderCategories();
    });
  });
}

function restoreTrash(id){
  const item=state.trash.find(entry=>entry.id===id);
  if(!item) return;
  const data=item.data||{};
  if(item.type==="article"){
    if(state.articles.some(article=>article.id===data.id)){toast("库里已经有这一条了");return}
    if(data.categoryId&&!state.categories.some(c=>c.id===data.categoryId)) data.categoryId="";
    state.articles.unshift(data);
  }else if(item.type==="category"){
    if(state.categories.some(c=>c.id===data.id)){toast("这个分类还在");return}
    if(data.parentId&&!state.categories.some(c=>c.id===data.parentId)) data.parentId=null;
    state.categories.push(data);
  }else if(item.type==="tag"){
    if(state.tags.some(tag=>tag.id===data.id)){toast("这个标签还在");return}
    state.tags.push(data);
  }else if(item.type==="navigation"){
    if(state.navigation.some(nav=>nav.id===data.id)){toast("这个导航还在");return}
    state.navigation.push(data);
  }else{toast("这种类型恢复不了");return}
  state.trash=state.trash.filter(entry=>entry.id!==id);
  log("restore","恢复："+item.name);
  save();
  renderAll();
  toast("已恢复");
}

  state.trash=state.trash.filter(entry=>entry.id!==id);

function emptyTrash(){

  if(!confirm("清空回收站？清掉就找不回来了。")) return;
  const count=state.trash.length;

function purgeExpired(manual){
  const days=Number(state.config.retention||0);
  if(!days){if(manual) toast("自动清理是关的");return false}
  const cutoff=Date.now()-days*86400000;
  const keep=[];
  let dropped=0;
  state.trash.forEach(item=>{
    const time=new Date(item.deletedAt).getTime();
    if(!Number.isNaN(time)&&time<cutoff) dropped++;
    else keep.push(item);
  });
  if(!dropped){if(manual) toast("没有过期的");return false}
  state.trash=keep;
  log("purge","清理过期 "+dropped+" 条");
  if(manual){save();renderTrash();toast("清掉了 "+dropped+" 条")}
  return true;
}

function exportData(){
  const copy=librarySnapshot();
  copy.exportedAt=now();
  copy.schema=4;
  const blob=new Blob([JSON.stringify(copy,null,2)],{type:"application/json"});
  const link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download="ARKKNOWLEDGE_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(link.href),1000);
  log("export","导出了备份");
  save();
  toast("备份已下载");
}
function importData(file){
  const input=document.getElementById("importFile");
  if(!file){if(input) input.value="";return}
  const reader=new FileReader();
  reader.onload=()=>{
    if(input) input.value="";
    try{
      let text=String(reader.result||"");
      if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
      const data=JSON.parse(text);
      if(!data||typeof data!=="object"||Array.isArray(data)||!Array.isArray(data.articles)) throw new Error("bad");
      if(!confirm("导入会用这份 JSON 换掉现在的内容，继续？")) return;
      applyLibrary(data);
      toast("导入好了");
    }catch(e){toast("这个文件读不了")}
  };
  reader.readAsText(file);
}

  ].filter(item=>!q||item[0].toLowerCase().includes(q)||item[1].toLowerCase().includes(q));
  if(q){
    state.articles.filter(article=>!article.archived&&(article.title+" "+(article.summary||"")).toLowerCase().includes(q)).slice(0,6).forEach(article=>{
      items.push(["打开 "+article.title,statusText(article),()=>openArticle(article.id)]);
    });
  }
  if(commandIndex<0) commandIndex=items.length-1;
  if(commandIndex>=items.length) commandIndex=0;
  commandItems=items;
  const box=document.getElementById("commands");
  if(!items.length){box.innerHTML=empty("没有匹配的");return}
  box.innerHTML=items.map((item,index)=>'<div class="command-item'+(index===commandIndex?" active":"")+'" data-index="'+index+'"><span>'+esc(item[0])+'</span><small style="color:var(--muted)">'+esc(item[1]||"")+"</small></div>").join("");
  [...box.children].forEach(el=>{
    el.addEventListener("click",()=>{commandIndex=Number(el.dataset.index);runCommand()});
  });
  const active=box.querySelector(".active");
  if(active) active.scrollIntoView({block:"nearest"});
}
function runCommand(){
  const item=commandItems[commandIndex];
  if(!item) return;
  closeCommand();
  item[2]();
}
function articleIdFromHash(){
  const matched=location.hash.match(/^#article=(.+)$/);
  if(!matched) return "";
  try{return decodeURIComponent(matched[1])}catch(e){return matched[1]}
}
function handleAction(el){
  const act=el.dataset.act;
  const id=el.dataset.id||"";
  if(act==="open-article") openArticle(id);
  else if(act==="edit-article") openArticleEditor(id);
  else if(act==="delete-article") deleteArticle(id);
  else if(act==="fav") toggleFavorite(id);
  else if(act==="pin") togglePin(id);
  else if(act==="new-article") openArticleEditor();
  else if(act==="open-home") showHomeNode(el.dataset.article,el.dataset.node);
  else if(act==="open-node"){closeSearchDrop();openArticleNode(el.dataset.article,el.dataset.node)}
  else if(act==="jump-search") jumpSearch(document.getElementById("globalSearch").value.trim());
  else if(act==="go-back") showView(lastView||"home");
  else if(act==="edit-body") editInManager(id);
  else if(act==="versions") openVersionList(id);
  else if(act==="copy-link") copyArticleLink(id);
  else if(act==="print-article") window.print();
  else if(act==="restore-ver") restoreVersion(id);
  else if(act==="select-node") selectDocumentNode(el.dataset.article,el.dataset.node);
  else if(act==="toggle-branch") toggleDocumentBranch(el.dataset.key);
  else if(act==="add-child") addDocumentNode(el.dataset.article,el.dataset.node,"child");
  else if(act==="add-sibling") addDocumentNode(el.dataset.article,el.dataset.node,"sibling");
  else if(act==="move-node") moveDocumentNode(el.dataset.article,el.dataset.node,Number(el.dataset.dir));
  else if(act==="promote-node") promoteDocumentNode(el.dataset.article,el.dataset.node);
  else if(act==="demote-node") demoteDocumentNode(el.dataset.article,el.dataset.node);
  else if(act==="delete-node") deleteDocumentNode(el.dataset.article,el.dataset.node);
  else if(act==="save-node") saveDocumentNode(false);
  else if(act==="discard-node") discardDocumentDraft();
  else if(act==="preview-doc") previewDocument(id);
  else if(act==="node-tab") setNodeTab(el.dataset.tab);
  else if(act==="edit-cat") openCategoryEditor(id);
  else if(act==="add-subcat") openCategoryEditor(null,id);
  else if(act==="move-cat") moveCat(id,Number(el.dataset.dir));
  else if(act==="delete-cat") deleteCategory(id);
  else if(act==="edit-tag") openTagEditor(id);
  else if(act==="delete-tag") deleteTag(id);
  else if(act==="restore-trash") restoreTrash(id);
  else if(act==="purge-trash") permanentDelete(id);
  else if(act==="nav-toggle") toggleNavVisible(id);
  else if(act==="edit-nav") openNavEditor(id);
  else if(act==="move-nav") moveNav(id,Number(el.dataset.dir));
  else if(act==="delete-nav") deleteNav(id);
}

document.querySelector(".sidebar").addEventListener("click",event=>{
  const btn=event.target.closest(".nav-item");
  if(!btn) return;
  if(btn.dataset.view==="custom"){
    openCustomNav(state.navigation.find(item=>item.id===btn.dataset.navId));
    return;
  }
  if(btn.dataset.view) showView(btn.dataset.view);
});
document.body.addEventListener("click",event=>{
  if(!event.target.closest(".search")) closeSearchDrop();
  const el=event.target.closest("[data-act]");
  if(!el) return;
  handleAction(el);
});
document.getElementById("knowledgeTable").addEventListener("change",event=>{
  const box=event.target.closest(".rowcheck");
  if(box) selectArticle(box.dataset.id,box.checked);
});
document.getElementById("themeBtn").addEventListener("click",toggleTheme);
document.getElementById("importFile").addEventListener("change",event=>importData(event.target.files&&event.target.files[0]));
const globalSearch=document.getElementById("globalSearch");
globalSearch.addEventListener("input",()=>{
  renderSearchDrop(globalSearch.value);
  if(document.getElementById("view-search").classList.contains("active")) renderGlobalSearch(globalSearch.value);
});
globalSearch.addEventListener("keydown",event=>{
  if(event.key==="Enter"){event.preventDefault();jumpSearch(globalSearch.value.trim())}
  else if(event.key==="Escape"){closeSearchDrop();globalSearch.blur()}
});
document.querySelectorAll(".settings-tab").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".settings-tab").forEach(item=>item.classList.remove("active"));
  document.querySelectorAll(".setting-section").forEach(item=>item.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("set-"+btn.dataset.tab).classList.add("active");
}));
document.addEventListener("keydown",event=>{
  const commandOpen=document.getElementById("commandBg").classList.contains("show");
  const typing=event.target.closest("input,textarea,select");
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="k"){
    event.preventDefault();
    if(commandOpen) closeCommand(); else openCommand();
    return;
  }
  if(commandOpen){
    if(event.key==="ArrowDown"){event.preventDefault();commandIndex++;renderCommands(false);return}
    if(event.key==="ArrowUp"){event.preventDefault();commandIndex--;renderCommands(false);return}
    if(event.key==="Enter"){event.preventDefault();runCommand();return}
    if(event.key==="Escape"){event.preventDefault();closeCommand();return}
  }
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="s"){
    const manager=document.getElementById("view-document-manager");
    const modalOpen=document.getElementById("modalBg").classList.contains("show");
    if(manager&&manager.classList.contains("active")&&!modalOpen&&document.getElementById("nodeBody")){
      event.preventDefault();
      saveDocumentNode(false);
    }
    return;
  }
  if(event.key==="Escape"){closeModal();closeCommand();closeSearchDrop();return}
  if(typing) return;
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="n"){event.preventDefault();openArticleEditor();return}
  if(event.key==="/"){event.preventDefault();globalSearch.focus()}
});
window.addEventListener("hashchange",()=>{
  const id=articleIdFromHash();
  if(id) openArticle(id);
});
window.addEventListener("beforeunload",event=>{
  if(documentDraft?.dirty){event.preventDefault();event.returnValue=""}
});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{if(state.config.theme==="system") applyConfig()});

load();
renderAll();
const startId=articleIdFromHash();
if(startId){
  if(articleById(startId)) openArticle(startId);
  else toast("链接里的文章不在这台浏览器里");
}
</script>
</body>
</html>
